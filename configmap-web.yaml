apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: default
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="utf-8">
      <title>Страница из ConfigMap с измененным заголовком страницы</title>
    </head>
    <body>
      <h1>Привет от Kubernetes! И привет от моего контента страницы!</h1>
    </body>
    </html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: multitool-config
data:
  HTTP_PORT: "1180"
  HTTPS_PORT: "11443"